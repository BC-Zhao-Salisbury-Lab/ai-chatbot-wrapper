# Keeps the Supabase project "ai-chatbot-study" active so it isn't auto-paused.
# Save this file in your GitHub repo at: .github/workflows/supabase-keepalive.yml
#
# Add these in GitHub: repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL       e.g. https://gicsehzwnkvgjpfuqvet.supabase.co
#   SUPABASE_ANON_KEY  Supabase dashboard → Project Settings → API → "anon" / publishable key
#   SUPABASE_TABLE     the name of any table in your project (e.g. "messages")

name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */3 * *"   # every 3 days at 12:00 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/$SUPABASE_TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          cat response.txt
          if [ "$status" -ge 400 ]; then
            echo "Ping failed. Check the secrets and the table name."
            exit 1
          fi
